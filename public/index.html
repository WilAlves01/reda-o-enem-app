<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Corrigir redação — Método Jana Rabelo</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-topbar">
    <div class="brand">Redação ENEM · Método Jana Rabelo</div>
    <button type="button" class="app-logout" id="btn-logout">Sair</button>
  </header>

  <main>
    <h1>Corrigir redação</h1>
    <p class="subtitle">Cole o tema (opcional) e o texto da redação. A correção segue a matriz oficial do ENEM e o método de correção da Jana Rabelo.</p>

    <div class="banner" id="banner-erro"><strong>Erro:</strong>&nbsp;<span id="banner-erro-texto"></span></div>

    <form id="form-correcao">
      <div class="field">
        <label for="tema">Tema da proposta (opcional)</label>
        <input type="text" id="tema" name="tema" placeholder="Ex.: Desafios para a valorização da herança africana no Brasil" />
      </div>
      <div class="field">
        <label for="texto">Texto da redação</label>
        <textarea id="texto" name="texto" placeholder="Cole aqui o texto completo da redação..." required></textarea>
      </div>
      <div class="actions">
        <button type="submit" class="primary" id="btn-corrigir">Corrigir redação</button>
        <span class="status-line" id="status-linha"></span>
      </div>
    </form>

    <div id="resultado"></div>
  </main>
