<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aprender — Método Jana Rabelo</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-topbar">
    <div class="brand">Redação ENEM · Método Jana Rabelo</div>
    <button type="button" class="app-logout" id="btn-logout">Sair</button>
  </header>

  <main class="aprender-main">
    <h1>Aprender</h1>
    <p class="subtitle">Construa uma redação do zero, parágrafo por parágrafo, com a professora Jana Rabelo te orientando em cada etapa pelo chat ao lado.</p>

    <div class="tema-box" id="tema-box">
      <div class="tema-header">
        <span class="tema-label">Tema da redação</span>
        <button type="button" class="secondary" id="btn-novo-tema">Sortear novo tema</button>
      </div>
      <h2 id="tema-titulo"></h2>
      <div id="textos-motivadores"></div>
    </div>

    <div class="banner" id="banner-erro"><strong>Erro:</strong>&nbsp;<span id="banner-erro-texto"></span></div>

    <div class="aprender-layout">
      <div class="aprender-etapas" id="etapas"></div>

      <aside class="aprender-chat">
        <div class="chat-header">
          <div class="chat-avatar">JR</div>
          <div>
            <div class="chat-nome">Professora Jana</div>
            <div class="chat-sub">te orientando parágrafo a parágrafo</div>
          </div>
        </div>
        <div class="chat-mensagens" id="chat-mensagens"></div>
      </aside>
    </div>

    <div id="resultado-final"></div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span>Corrigir</span>
    </a>
    <a href="praticar.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
      <span>Praticar</span>
    </a>
    <a href="home.html" class="bottom-nav-item bottom-nav-center" aria-label="Início">
      <span class="bottom-nav-center-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7"/><path d="M9 22V12h6v10"/><path d="M5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10"/></svg>
      </span>
    </a>
    <a href="aprender.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      <span>Aprender</span>
    </a>
    <a href="dashboard.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
      <span>Dashboard</span>
    </a>
  </nav>

  <script src="nav.js"></script>
  <script src="temas.js"></script>
  <script src="anotacoes.js"></script>
  <script src="aprender.js"></script>
</body>
</html>
