<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Praticar — Método Jana Rabelo</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mobile-topbar">
    <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">Redação ENEM · Método Jana Rabelo</div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">Redação ENEM · Método Jana Rabelo</div>
      <nav>
        <a href="index.html">Corrigir</a>
        <a href="praticar.html" class="active">Praticar</a>
        <a href="aprender.html">Aprender</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
      <div class="sidebar-footer">
        <span class="sidebar-user" id="sidebar-user"></span>
        <button type="button" class="sidebar-logout" id="btn-logout">Sair</button>
      </div>
    </aside>

    <main>
      <h1>Praticar</h1>
      <p class="subtitle">Sorteie um tema com textos motivadores e treine sua redação dissertativo-argumentativa. Quando terminar, envie para correção.</p>

      <div class="tema-box" id="tema-box">
        <div class="tema-header">
          <span class="tema-label">Tema sorteado</span>
          <button type="button" class="secondary" id="btn-novo-tema">Sortear novo tema</button>
        </div>
        <h2 id="tema-titulo"></h2>
        <div id="textos-motivadores"></div>
      </div>

      <div class="banner" id="banner-erro"><strong>Erro:</strong>&nbsp;<span id="banner-erro-texto"></span></div>

      <div class="field">
        <label for="texto">Sua redação</label>
        <textarea id="texto" placeholder="Escreva aqui a sua redação sobre o tema sorteado acima..."></textarea>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="btn-corrigir">Corrigir esta redação</button>
        <span class="status-line" id="status-linha"></span>
      </div>

      <div id="resultado"></div>
    </main>
  </div>

  <script src="nav.js"></script>
  <script src="temas.js"></script>
  <script src="anotacoes.js"></script>
  <script src="praticar.js"></script>
</body>
</html>
